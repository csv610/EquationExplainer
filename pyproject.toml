[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "matheqs"
version = "1.0.0"
description = "AI-powered physics equation explainer"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Source = "https://github.com/csv610/MathEqs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "mathenv/*", ".github/*", "assets/*", "cli.py", "cli_utils.py", "example.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"assets/*" = ["E501", "SIM115"]
"__init__.py" = ["N999"]
"tests/__init__.py" = ["N999"]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = [
    "mathenv/",
    ".github/",
    "build/",
    "assets/",
    "tests/",
]
ignore_missing_imports = true
