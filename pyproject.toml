[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "matheqs"
version = "1.0.0"
description = "AI-powered physics equation explainer"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Source = "https://github.com/csv610/MathEqs"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pydantic>=2.0",
]

[project.scripts]
matheqs = "matheqs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["matheqs*"]

[tool.setuptools.package-data]
"matheqs" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src/matheqs"]
omit = ["tests/*", "mathenv/*", ".github/*", "assets/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"assets/*" = ["E501", "SIM115"]
"src/matheqs/__init__.py" = ["N999"]
"tests/__init__.py" = ["N999"]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = [
    "mathenv/",
    ".github/",
    "build/",
    "assets/",
    "tests/",
]
ignore_missing_imports = true
